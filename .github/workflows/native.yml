name: Приложение iPhone и Android

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Сборка APK
        id: build
        continue-on-error: true
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: |
          set -o pipefail
          bash scripts/ci-android.sh 2>&1 | tee ci-android.log
      - name: Выложить APK в «Releases»
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs
          VERSION=$(node -p "require('./package.json').version")
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --prerelease --title "Архив $VERSION для Android" --notes-file release-notes.md
          fi
          gh release edit android-latest --title "Архив $VERSION для Android" --notes-file release-notes.md
          gh release upload android-latest archive-android.apk --clobber
      - name: Журнал сборки
        if: always()
        run: |
          mkdir -p /tmp/log && cp ci-android.log /tmp/log/ 2>/dev/null || echo "нет журнала" > /tmp/log/ci-android.log
          cd /tmp/log && git init -q && git checkout -q -b ci-logs-android
          git -c user.name=ci -c user.email=ci@local add . && git -c user.name=ci -c user.email=ci@local commit -qm "android ${GITHUB_SHA::7}: ${{ steps.build.outcome }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-android
      - if: steps.build.outcome != 'success'
        run: exit 1

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Сборка для iPhone (симулятор)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/ci-ios.sh 2>&1 | tee ci-ios.log
      - name: Журнал сборки
        if: always()
        run: |
          mkdir -p /tmp/log && cp ci-ios.log /tmp/log/ 2>/dev/null || echo "нет журнала" > /tmp/log/ci-ios.log
          cd /tmp/log && git init -q && git checkout -q -b ci-logs-ios
          git -c user.name=ci -c user.email=ci@local add . && git -c user.name=ci -c user.email=ci@local commit -qm "ios ${GITHUB_SHA::7}: ${{ steps.build.outcome }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-ios
      - if: steps.build.outcome != 'success'
        run: exit 1
